name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # GitHub's own website host is very slow for big files on some Indian networks, so the app's
      # files are served by jsDelivr, straight from this repo's "site" branch (one tag per publish).
      FILES: https://cdn.jsdelivr.net/gh/${{ github.repository }}@site-${{ github.run_number }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /wallet/ --deploy-url "$FILES"
      # Every file of the app, so the phone can keep them all for offline use.
      - name: List the files
        working-directory: dist/fitwallet/browser
        run: ls *.js *.css | node -e "console.log(JSON.stringify(require('fs').readFileSync(0,'utf8').trim().split('\n')))" > files.json
      - name: Put the built files on the "site" branch
        working-directory: dist/fitwallet/browser
        run: |
          git init -q -b site
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Site ${{ github.run_number }}"
          git tag site-${{ github.run_number }}
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" site site-${{ github.run_number }}
          rm -rf .git
      # The first request for a file makes jsDelivr fetch it from GitHub, which can take a minute.
      # Asking for every file here means no visitor is ever that first request.
      - name: Warm every file on the fast host
        working-directory: dist/fitwallet/browser
        run: |
          for f in *.js *.css; do
            for i in $(seq 1 20); do
              curl -sf --max-time 120 -o /dev/null "$FILES$f" && continue 2
              sleep 5
            done
            echo "jsDelivr never served $f" && exit 1
          done
      # Opening a page inside the app directly (or refreshing it) still lands in the app.
      - run: cp dist/fitwallet/browser/index.html dist/fitwallet/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fitwallet/browser
      - id: deploy
        uses: actions/deploy-pages@v4
