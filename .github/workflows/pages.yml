name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build --base-href /wallet/
      # Opening a page inside the app directly (or refreshing it) still lands in the app.
      - run: cp dist/fitwallet/browser/index.html dist/fitwallet/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fitwallet/browser
      - id: deploy
        uses: actions/deploy-pages@v4
